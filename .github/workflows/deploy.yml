name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Inject Firebase Secrets for Production
        run: |
          API_KEY="${{ secrets.FIREBASE_API_KEY }}"
          AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}"
          DB_URL="${{ secrets.FIREBASE_DATABASE_URL }}"
          PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}"
          MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"
          APP_ID="${{ secrets.FIREBASE_APP_ID }}"

          if [ -z "$API_KEY" ]; then API_KEY="AIzaSyCC3idHLHcFFcGOAbdJGtuWYsrV0PFf8Oc"; fi
          if [ -z "$AUTH_DOMAIN" ]; then AUTH_DOMAIN="crosssfit--3640-tv.firebaseapp.com"; fi
          if [ -z "$DB_URL" ]; then DB_URL="https://crosssfit--3640-tv-default-rtdb.firebaseio.com"; fi
          if [ -z "$PROJECT_ID" ]; then PROJECT_ID="crosssfit--3640-tv"; fi
          if [ -z "$STORAGE_BUCKET" ]; then STORAGE_BUCKET="crosssfit--3640-tv.firebasestorage.app"; fi
          if [ -z "$MESSAGING_SENDER_ID" ]; then MESSAGING_SENDER_ID="908256000888"; fi
          if [ -z "$APP_ID" ]; then APP_ID="1:908256000888:web:09e4bffb19519b8784668d"; fi

          mkdir -p src/environments
          cat <<EOF > src/environments/environment.prod.ts
          export const environment = {
            production: true,
            firebase: {
              apiKey: "$API_KEY",
              authDomain: "$AUTH_DOMAIN",
              databaseURL: "$DB_URL",
              projectId: "$PROJECT_ID",
              storageBucket: "$STORAGE_BUCKET",
              messagingSenderId: "$MESSAGING_SENDER_ID",
              appId: "$APP_ID"
            },
            adminUids: {
              superAdmin: ['LCjGIWZSlKUfEjBEZ2OgMYEd7HH3'],
              weeklyAdmin: ['LCjGIWZSlKUfEjBEZ2OgMYEd7HH3', '2qCO5Z07nXNkWft4od26Mdw73x42'],
              celebrationAdmin: ['LCjGIWZSlKUfEjBEZ2OgMYEd7HH3']
            }
          };
          EOF
          cp src/environments/environment.prod.ts src/environments/environment.ts

      - name: Build Project
        run: npx ng build --configuration production --base-href /${{ github.event.repository.name }}/

      - name: Prepare GitHub Pages Files (.nojekyll & 404.html)
        id: output_path
        run: |
          if [ -d "./dist/wod-tv-angular/browser" ]; then
            TARGET_PATH="./dist/wod-tv-angular/browser"
          else
            TARGET_PATH="./dist/wod-tv-angular"
          fi
          
          # Prevent Jekyll processing on GitHub Pages
          touch "$TARGET_PATH/.nojekyll"
          
          # Create 404 fallback for SPA routing
          if [ -f "$TARGET_PATH/index.html" ]; then
            cp "$TARGET_PATH/index.html" "$TARGET_PATH/404.html"
          fi
          
          echo "BUILD_PATH=$TARGET_PATH" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
